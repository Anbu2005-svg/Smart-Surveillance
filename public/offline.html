<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>CCTV AI - Offline Mode</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: radial-gradient(1000px 600px at 50% 30%, #0c2044, #071026 70%);
        color: #dbe8ff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(56, 189, 248, 0.25);
        border-radius: 24px;
        padding: 36px 24px;
        max-width: 400px;
        width: 100%;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
      }
      .logo {
        width: 76px;
        height: 76px;
        margin: 0 auto 18px;
        border-radius: 50%;
        display: block;
        box-shadow: 0 8px 24px rgba(36, 161, 222, 0.45);
      }
      h1 {
        font-size: 22px;
        font-weight: 800;
        color: #f1f5f9;
        margin-bottom: 8px;
      }
      p {
        font-size: 13px;
        line-height: 1.6;
        color: #94a3b8;
        margin-bottom: 24px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        padding: 13px 20px;
        border-radius: 14px;
        background: linear-gradient(135deg, #2AABEE, #229ED9);
        color: #ffffff;
        font-size: 14px;
        font-weight: 700;
        border: none;
        cursor: pointer;
        transition: transform 0.15s;
        text-decoration: none;
      }
      .btn:active {
        transform: scale(0.97);
      }
      .hint {
        margin-top: 16px;
        font-size: 11px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-192.png" alt="Telegram CCTV" class="logo" />
      <h1>Connection Offline</h1>
      <p>
        You are currently offline. Cached dashboard screens remain available, but real-time camera feeds and Telegram AI alerts require an active network connection.
      </p>
      <button class="btn" onclick="window.location.reload()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
        Retry Connection
      </button>
      <div class="hint">Will reconnect automatically once network returns.</div>
    </div>
  </body>
</html>
