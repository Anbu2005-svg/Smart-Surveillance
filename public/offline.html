<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CCTV AI - Offline Mode</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Trebuchet MS', 'Segoe UI', Tahoma, sans-serif;
        background: radial-gradient(1000px 600px at 50% 30%, #0c2044, #071026 70%);
        color: #dbe8ff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(56, 189, 248, 0.25);
        border-radius: 20px;
        padding: 36px 28px;
        max-width: 440px;
        width: 100%;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      }
      .icon-circle {
        width: 80px;
        height: 80px;
        margin: 0 auto 20px;
        border-radius: 50%;
        background: rgba(56, 189, 248, 0.1);
        border: 2px dashed #38bdf8;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .icon-circle svg {
        width: 44px;
        height: 44px;
      }
      h1 {
        font-size: 24px;
        font-weight: 800;
        color: #f1f5f9;
        margin-bottom: 10px;
      }
      p {
        font-size: 14px;
        line-height: 1.6;
        color: #94a3b8;
        margin-bottom: 24px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        padding: 12px 20px;
        border-radius: 12px;
        background: #0284c7;
        color: #ffffff;
        font-size: 15px;
        font-weight: 700;
        border: none;
        cursor: pointer;
        transition: background 0.2s;
        text-decoration: none;
      }
      .btn:hover {
        background: #0369a1;
      }
      .hint {
        margin-top: 18px;
        font-size: 12px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>
      <h1>Connection Offline</h1>
      <p>
        The app is running offline. Cached dashboard screens are available, but live video stream processing and AI detection alerts require an active network connection to the CCTV server.
      </p>
      <button class="btn" onclick="window.location.reload()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
        Retry Connection
      </button>
      <div class="hint">Will automatically reconnect once network connectivity returns.</div>
    </div>
  </body>
</html>
